ng:13px 12px}.price-value{font-size:28px;line-height:1.4;color:var(--navy);font-weight:800;white-space:nowrap}.price-value small{font-size:12px;font-weight:600}.price-body p{font-size:12px;line-height:1.75;margin:7px 0 0}.plan-list{font-size:12px;line-height:1.75;border-top:1px solid #e1e5ec;padding-top:12px;margin-top:13px}.plan-list p{margin-bottom:10px}.compose{background:#f9fbfc;display:flex;gap:11px;align-items:center;min-height:50px;padding:9px 12px;color:#4f6074;border-top:1px solid #d6dfe8}.compose .plus{font-size:24px;font-family:Arial,sans-serif;line-height:1}.input-ghost{height:29px;border:1px solid #dce4eb;background:#fff;border-radius:18px;flex:1}.compose .mic{width:13px;height:20px;border:1.5px solid #5a697b;border-radius:8px;transform:scale(.75)}.homebar{height:17px;background:#f9fbfc;display:flex;align-items:center;justify-content:center}.homebar:after{content:"";width:105px;height:4px;border-radius:3px;background:#1e2835}.review-foot{max-width:540px;margin:18px auto 0;font-size:12px;line-height:1.8;color:#667487;text-align:center}.review-foot a{text-decoration:underline;text-underline-offset:3px}.phone [hidden]{display:none!important}button[disabled]{cursor:default}.stages{display:none}.summary-links{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:12px}.summary-links a{font-size:12px;padding:6px 0}

<body>
<main>
<header class="review-head">
 <div class="review-tag">受信イメージ・本番未送信</div>
 <h1>LINEでは、こう届きます。</h1>
 <p><span>2問・各4択と、資料・動画の表示見本。</span><br><span>配信時刻・間隔は既存設定を維持する設計です。</span></p>
</header>
<nav class="controls" aria-label="表示する段階">

</nav>
<div class="stage-caption"><div class="stage-number" id="stage-number"></div><h2 id="stage-title"></h2><p id="stage-note"></p></div>
<section class="phone" aria-label="LINE受信画面の見本">
 <div class="phone-top"><div class="status"><span>9:41</span><svg viewBox="0 0 44 11" aria-hidden="true"><path d="M1 10V7h2v3zm4 0V5h2v5zm4 0V3h2v7zm4 0V1h2v9z" fill="currentColor"/><path d="M19 4q5-5 10 0m-8 2q3-3 6 0m-4 2h2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="33" y="1" width="9" height="8" rx="1.5" fill="none" stroke="currentColor"/><rect x="34.5" y="2.5" width="6" height="5" rx=".5" fill="currentColor"/><path d="M43 4v2" stroke="currentColor"/></svg></div><div class="appbar"><span class="back">‹</span><div class="app-name"><span class="official">✓</span>メディくる</div><span class="menu">☰</span></div></div>
 <div class="conversation" id="conversation"></div>
 <div class="compose" aria-hidden="true"><span class="plus">＋</span><span>▧</span><span class="input-ghost"></span><span class="mic"></span></div><div class="homebar" aria-hidden="true"></div>
</section>
<div class="all-stages" id="all-stages"></div>
<footer class="review-foot"><p id="review-note">各段階を切り替えて確認できます。<br>この見本から、<br>LINE送信・予約は行われません。</p><div class="summary-links"><a href="?all=1">全段階をまとめて見る</a><a href="?stage=greeting">1段階ずつ見る</a><a href="assets/page-1.png" target="_blank">資料1枚目を拡大</a><a href="assets/page-2.png" target="_blank">資料2枚目を拡大</a></div></footer>
</main>
<script>
const approvedCopy={"revision":"rev3_two_questions_four_choices_each","q1":{"text":"今、一番解決したい課題は？","choices":["AI検索で知ってもらいたい","検索した人に信頼されたい","他社との違いを伝えたい","問い合わせを増やしたい"]},"q2":{"text":"お立場を教えてください。","choices":["経営者・役員","営業・マーケ担当","広報・採用担当","その他"]},"greeting":"ご登録ありがとうございます。\nAIを24時間365日、\nあなたの会社の魅力を伝える営業マンに。\n業界初・唯一無二の\nAI検索ブランディング、メディくるです。\nまず2つの質問で、\n御社に合う情報をご案内します。","completion":"ご回答ありがとうございます。\n一番の違いは、正式なニュースを\n信頼の土台にすること。\n① プロによる正式な取材記事を\n大手ネットニュースへ掲載。\n② 複数の第三者メディアの口コミ・評判。\n③ AI検索の特許技術。\nこの3つを掛け合わせ、\n会社の強みを人とAIの判断材料へ。\nまずは、資料・動画をご覧ください。","difference_followup":"他社のAI検索対策と、何が違う？\n一番の違いは、正式なニュースを信頼の土台にすることです。\n自社が作ったPR文を出すだけでなく、プロが背景・強み・実績を取材し、正式な取材記事として大手ネットニュースへの掲載を土台にします。\nそこに、複数の第三者メディアの口コミ・評判と、AI検索の特許技術を掛け合わせます。\n記事を増やすだけ、技術対策だけに寄せず、会社を調べる人やAIの判断材料となる情報を整える。\nこの掛け合わせが、業界初・唯一無二のAI検索ブランディングです。","late_pricing":"基本・おすすめは、月額10万円（税別／税込110,000円）。\n会社名・サービス名の指名検索に加え、一般検索まで整えるプランです。\n指名検索に絞る場合は月額5万円（税別／税込55,000円）。\n定期ニュースでさらに強化する場合は月額20万円（税別／税込220,000円）。10万円の内容に、大手ネットニュース配信が年2回加わります。\n10万円・20万円は最低6か月契約・6か月ごと自動更新。5万円は最低1年契約・1年ごと自動更新です。\n御社に合う範囲は、無料診断で確認します。","flow":"登録直後→Q1課題4択→Q2立場4択→完了3特徴→既存資料2枚→動画→既存サービス紹介枠で差別化補足→既存の遅い料金枠で10万円基本。既存タイミング/送信条件を増やさない。","price_policy":"Q1/Q2の回答で価格を自動選定しない。10万円基本は後段料金説明枠で表示、挨拶/完了で料金を急がせない。","preview_note":"受信画面イメージは別プレビューで確認。表示見本であり、本番送信・設定反映ではない。"};
const incoming=(html,cls='bubble')=>`<div class="message"><div class="avatar">メ</div><div class="content"><div class="sender">メディくる</div><div class="${cls}">${html}</div></div></div>`;
const sent=text=>`<div class="sent"><p>${text}</p></div>`;
const q1=['AI検索で知ってもらいたい','検索した人に信頼されたい','他社との違いを伝えたい','問い合わせを増やしたい'];
const q2=['経営者・役員','営業・マーケ担当','広報・採用担当','その他'];
let answer1='検索した人に信頼されたい',answer2='経営者・役員';
const question=(num,title,options)=>incoming(`<div class="cardhead"><div class="progress">質問 ${num} / 2</div><h3>${title}</h3></div><div class="choices">${options.map((t,i)=>`<button class="choice" data-question="${num}" data-answer="${i}">${t}</button>`).join('')}</div>`,'card');
const lineText=t=>t.replaceAll('\n','<br>');
const featureItems=approvedCopy.completion.split('\n');
const completionHtml=`<p>${featureItems[0]}</p><p><strong>${lineText(featureItems.slice(1,3).join('\n'))}</strong></p><div class="features"><div class="feature"><span class="num">①</span><div><strong>${lineText(featureItems.slice(3,5).join('\n').replace('① ',''))}</strong></div></div><div class="feature"><span class="num">②</span><div><strong>${featureItems[5].replace('② ','').replace('の口コミ','の<br>口コミ')}</strong></div></div><div class="feature"><span class="num">③</span><div><strong>${featureItems[6].replace('③ ','')}</strong></div></div></div><p>${lineText(featureItems.slice(7,9).join('\n'))}</p><p>${featureItems[9]}</p>`;
const greetingLines=approvedCopy.greeting.split('\n');
const greetingHtml=`<p>${greetingLines[0]}</p><p class="big">${greetingLines[1]}<br>あなたの会社の魅力を<br>伝える営業マンに。</p><p class="tagline">${greetingLines[3]}<br>${greetingLines[4].replace('、','、<br>')}</p><p>${lineText(greetingLines.slice(5).join('\n'))}</p>`;
const differenceLines=approvedCopy.difference_followup.split('\n');
const differenceHtml=differenceLines.map((t,i)=>i===0?`<p class="kicker">${t}</p>`:i===1?`<p class="big">${t.replace('、','、<br>').replace('ニュースを','ニュースを<br>')}</p>`:`<p>${t}</p>`).join('');
const priceLines=approvedCopy.late_pricing.split('\n');
const pricingHtml=`<p><strong>${priceLines[0]}</strong></p><div class="price-card"><div class="price-band">指名検索 ＋ 一般検索</div><div class="price-body"><div class="price-value">月額10万円 <small>税別</small></div><p>税込110,000円<br>最低6か月契約・<br>6か月ごとに自動更新</p></div></div><p>${priceLines[1]}</p><div class="plan-list"><p>${priceLines[2]}</p><p>${priceLines[3]}</p></div><p>${priceLines[4]}</p><p>${priceLines[5].replace('は、','は、<br>')}</p>`;
const stages=[
 {id:'greeting',name:'登録直後',title:'短い説明から、2問へ。',note:'最初にサービスの価値と違いを伝えます。',html:()=>incoming(greetingHtml)},
 {id:'q1',name:'Q1｜課題',title:'答えやすい、4つの課題。',note:'一番近いものを、1つタップします。',html:()=>question(1,'今、一番解決したい<br>課題は？',q1)},
 {id:'q2',name:'Q2｜お立場',title:'お立場も、1回のタップで。',note:'自由入力や予算の質問は増やしません。',html:()=>sent(answer1)+question(2,'お立場を<br>教えてください。',q2)},
 {id:'completion',name:'回答完了｜3つの特徴',title:'2問の後に、仕組みを整理。',note:'回答でプランを自動判定しません。',html:()=>sent(answer2)+incoming(completionHtml)},
 {id:'materials',name:'資料｜既存の2枚画像',title:'資料は、2枚の画像で。',note:'既存の資料2枚をそのまま表示。\n画像を押すと拡大できます。',html:()=>incoming(`<p><strong>サービスと導入事例を、<br>2枚にまとめました。</strong></p><p>気になるところは、<br>画像を拡大してご覧ください。</p>`)+incoming(`<div class="media-group"><a class="image-message" href="assets/page-1.png" target="_blank"><img src="assets/page-1.png" alt="メディくる サービスと新3プラン 資料1枚目"></a><a class="image-message" href="assets/page-2.png" target="_blank"><img src="assets/page-2.png" alt="メディくる 業種別導入事例とAI検索市場 資料2枚目"></a></div>`,'media-set')},

 {id:'difference',name:'後続説明｜他社との違い',title:'正式な取材がある意味を伝える。',note:'既存の説明枠の見本です。\n配信時刻は変えません。',html:()=>incoming(differenceHtml)},

const params=new URLSearchParams(location.search),allMode=params.get('all')==='1';
let active=Math.max(0,stages.findIndex(x=>x.id===params.get('stage')));
const select=document.getElementById('stage-select');stages.forEach((s,i)=>select.add(new Option(`${i+1}. ${s.name}`,String(i))));
function show(i){active=Math.min(stages.length-1,Math.max(0,i));const s=stages[active];select.value=String(active);document.getElementById('stage-number').textContent=`STAGE ${String(active+1).padStart(2,'0')} / ${stages.length}`;document.getElementById('stage-title').textContent=s.title;document.getElementById('stage-note').textContent=s.note;document.getElementById('conversation').innerHTML=s.html();document.getElementById('prev').disabled=active===0;document.getElementById('next').disabled=active===stages.length-1;history.replaceState(null,'',allMode?'?all=1':`?stage=${s.id}`);document.title=`${s.name}｜メディくる LINE受信イメージ`;document.querySelectorAll('#conversation [data-question]').forEach(b=>b.addEventListener('click',()=>{const n=Number(b.dataset.question),a=Number(b.dataset.answer);if(n===1)answer1=q1[a];else answer2=q2[a];show(active+1);window.scrollTo({top:0,behavior:'instant'})}));}
select.addEventListener('change',()=>show(Number(select.value)));document.getElementById('prev').addEventListener('click',()=>show(active-1));document.getElementById('next').addEventListener('click',()=>show(active+1));show(active);

const phoneTemplate=document.querySelector('main>.phone');
stages.forEach((s,i)=>{const section=document.createElement('section');section.className='all-stage';section.id=`all-${s.id}`;const caption=document.createElement('div');caption.className='all-stage-caption';caption.innerHTML=`<span>STAGE ${String(i+1).padStart(2,'0')}</span>${s.name}<small>${s.note}</small>`;const phone=phoneTemplate.cloneNode(true);phone.classList.add('all-phone');phone.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));phone.querySelector('.conversation').innerHTML=s.html();phone.querySelectorAll('[data-question]').forEach(b=>{b.disabled=true});section.append(caption,phone);document.getElementById('all-stages').append(section)});
