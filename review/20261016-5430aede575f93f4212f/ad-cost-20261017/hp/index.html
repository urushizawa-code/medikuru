<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>メディくる｜広告費への共感から始めるHP案</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0f2f5;color:#172f67;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;line-height:1.7}header{padding:24px 22px;background:#fff;border-top:4px solid #ad8b43;border-bottom:1px solid #d7dce5}header>div,main{max-width:1560px;margin:auto}h1{font-size:24px;margin:0 0 8px}p{margin:0;color:#5a6578;font-size:14px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px}button,a.link{font:700 13px/1.5 inherit;padding:9px 13px;border:1px solid #c4cdda;border-radius:5px;background:#fff;color:#172f67;text-decoration:none;cursor:pointer}button[aria-pressed="true"]{background:#172f67;color:white}.compare{display:grid;gap:24px;padding:24px;justify-content:center;align-items:start}.pane{width:var(--view-width,390px);max-width:100%;background:white;border:1px solid #d7dce5;border-radius:8px;overflow:hidden}.pane header{padding:14px 16px;border:0;background:#172f67;color:white;display:flex;justify-content:space-between;align-items:center;gap:12px}.pane h2{font-size:16px;margin:0}.pane a{color:white;font-size:12px;white-space:nowrap}.frame-wrap{width:100%;overflow:hidden}iframe{display:block;width:100%;height:1100px;border:0}.notice{padding:0 24px 24px;font-size:12px;color:#647088;text-align:center}@media(max-width:600px){header{padding:18px 14px}h1{font-size:20px}.compare{padding:16px 8px;gap:20px}.pane header{padding:12px}.controls button{padding:8px 10px}}
</style></head><body><header><div><h1>HPファーストビューの比較案</h1><p>現行のHPデザインを活かし、広告費への本音からAI営業マンの便益へつなぐ案です。</p><div class="controls"><span>表示幅</span><button data-width="320" aria-pressed="false">320px</button><button data-width="390" aria-pressed="true">390px</button><button data-width="1280" aria-pressed="false">PC・1280px</button><button id="full-toggle" aria-pressed="false">ページ全体を見る</button><a class="link" href="after.html" target="_blank">修正案を単独で開く ↗</a></div></div></header><main><div class="compare"><section class="pane"><header><h2>現行HP</h2><a href="before.html" target="_blank">全体を見る ↗</a></header><div class="frame-wrap"><iframe title="現行HPの比較用コピー" src="before.html" scrolling="no"></iframe></div></section><section class="pane"><header><h2>広告費への共感から始める案</h2><a href="after.html" target="_blank">全体を見る ↗</a></header><div class="frame-wrap"><iframe title="HP文言修正案" src="after.html" scrolling="no"></iframe></div></section></div><p class="notice">比較用プレビューです。本番HPは変更していません。外部送信・LINE遷移・計測は停止しています。</p></main><script>
let width=390,full=false;const grid=document.querySelector('.compare'),panes=[...document.querySelectorAll('.pane')],frames=[...document.querySelectorAll('iframe')],sizes=new Map();
function layout(){const available=grid.clientWidth-48;grid.style.gridTemplateColumns=available>=2*width+24?'repeat(2,minmax(0,'+width+'px))':'minmax(0,'+width+'px)';document.documentElement.style.setProperty('--view-width',width+'px');frames.forEach(f=>{const size=sizes.get(f);if(size)f.style.height=(full?size.height:size.heroHeight||size.height)+'px';});}
document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{width=Number(b.dataset.width);document.querySelectorAll('[data-width]').forEach(x=>x.setAttribute('aria-pressed',x===b));layout();});
document.querySelector('#full-toggle').onclick=e=>{full=!full;e.target.setAttribute('aria-pressed',full);e.target.textContent=full?'冒頭だけを見る':'ページ全体を見る';layout();};
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!=='mk-lp-preview-height')return;const f=frames.find(f=>f.contentWindow===e.source);if(!f)return;sizes.set(f,e.data);layout();});window.addEventListener('resize',layout);layout();
</script></body></html>
