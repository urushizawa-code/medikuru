<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>FV表示確認</title><style>*{box-sizing:border-box}body{margin:0;background:#eef1f1;font:14px system-ui;color:#263c41}header{padding:12px 18px;background:#fff;position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;flex-wrap:wrap}a{color:#08777e}button{padding:5px 10px}#frame{display:block;border:0;margin:18px auto;background:#fff;height:1400px}#result{font-size:12px}#wrap{overflow:auto}</style></head><body><header><a href="index.html">← 3案比較</a><span id="label"></span><nav><button data-v="A">A</button><button data-v="B">B</button><button data-v="C">C</button></nav><nav><button data-w="375">375px</button><button data-w="390">390px</button><button data-w="430">430px</button><button data-w="1280">1280px</button></nav><output id="result">表示確認中</output></header><div id="wrap"><iframe id="frame" title="LP表示確認"></iframe></div><script>const p=new URLSearchParams(location.search);let v=['A','B','C'].includes(p.get('v'))?p.get('v'):'A',w=[375,390,430,1280].includes(Number(p.get('w')))?Number(p.get('w')):390;const f=document.querySelector('#frame');function show(){f.style.width=w+'px';f.src=v+'.html';document.querySelector('#label').textContent=v+'案 / '+w+'px';history.replaceState(null,'','?v='+v+'&w='+w);}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{v=b.dataset.v;show()});document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{w=Number(b.dataset.w);show()});window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==f.contentWindow||e.data.type!=='mk-fv-qa')return;window.LAST_FV_QA=e.data;document.querySelector('#result').textContent='横はみ出し '+(e.data.horizontalOverflow?'あり':'なし')+' / 見出し・補足のはみ出し '+e.data.copyOverflow.length+'件 / FV '+e.data.heroHeight+'px / 計測停止';});show();</script></body></html>
