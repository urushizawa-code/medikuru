</style><main><span class="badge">確認用・広告は停止中</span><h1>広告動画04の改善案</h1><p>今の枠を生かし、写真の肩書き、取材・報道のイラスト、字幕、料金とクレジットの見せ方を整えました。</p><p class="fine">44.88秒。音声と長さは同じです。現在の広告素材・配信設定は変更していません。</p><div class="tabs"><button data-kind="mobile" aria-pressed="true">スマホ縦型 9:16</button><button data-kind="feed" aria-pressed="false">フィード 4:5</button></div><div class="player"><video controls playsinline preload="metadata" aria-label="広告動画04の改善案"></video></div><div class="links"><a id="full" download>フルHD動画を保存</a><a id="comparison-link" target="_blank">比較画像を大きく見る</a></div><p class="note">料金の「6か月契約」は、今回の確認版には追加していません。</p><p class="fine">料金は最初から月額10万円・税込11万円で表示し、3人の名前の間隔も整えました。</p><p><a href="consultation/">承認済みの無料相談への切り替え方針を見る</a></p><h2>今の動画／改善案</h2><p class="fine">冒頭・取材・報道・料金・最後を、同じ時刻で並べています。</p><img class="comparison" alt="今の広告動画04と改善案の比較"><script>const assets={"feed": {"full": "ad04-feed-full-r2.mp4", "preview": "ad04-feed-review-r2.mp4", "poster": "ad04-feed-poster-r2.jpg", "comparison": "compare-feed-r2.jpg"}, "mobile": {"full": "ad04-mobile-full-r2.mp4", "preview": "ad04-mobile-review-r2.mp4", "poster": "ad04-mobile-poster-r2.jpg", "comparison": "compare-mobile-r2.jpg"}};function show(kind){const a=assets[kind],v=document.querySelector('video');v.pause();v.src=a.preview;v.poster=a.poster;document.querySelector('#full').href=a.full;document.querySelector('#comparison-link').href=a.comparison;document.querySelector('.comparison').src=a.comparison;document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.kind===kind)));}document.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.kind));show('mobile');</script></main></html>
