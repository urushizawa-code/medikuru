<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>メディくる 紹介動画｜背景の確認</title>
<style>
:root{color-scheme:light;font-family:system-ui,"Hiragino Sans","Yu Gothic",sans-serif;color:#233438;background:#f7fbfb}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(125deg,#fff,#fbf8fb 52%,#f2fbfb)}
main{width:min(100%,920px);min-height:100svh;margin:auto;padding:24px 16px 40px}
h1,h2,p{margin:0}
h1{font-size:clamp(22px,5.8vw,32px);line-height:1.4}
p{margin-block:6px 18px;font-size:14px;line-height:1.7;color:#465a61}
.layout{display:grid;gap:16px;align-items:start}
.panel{padding:16px;background:#fff;border:1px solid #dcebed;border-radius:16px}
video{display:block;width:min(100%,350px,38svh);aspect-ratio:9/16;margin:auto;background:#f5fafb;border-radius:12px}
h2{font-size:17px;margin-bottom:8px}
img{display:block;width:100%;height:auto}
a{display:inline-block;margin-top:12px;color:#116672;font-size:14px;font-weight:650}
@media(min-width:740px){main{padding-block:36px}.layout{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main>
<h1>メディくるの約2分半の紹介動画</h1>
<p>白基調のLP・HP・営業資料に合わせた背景の確認版</p>
<div class="layout">
<section class="panel" aria-label="紹介動画を再生">
<video controls playsinline preload="none" poster="poster.jpg" aria-label="メディくる紹介動画・確認版">
<source src="medikuru-intro-preview.mp4" type="video/mp4">
</video>
<a href="medikuru-intro-preview.mp4">動画ファイルを開く</a>
</section>
<section class="panel">
<h2>背景の変更前と変更後</h2>
<a href="comparison.png"><img alt="表紙・ニュース報道・分析・料金・締めを左に変更前、右に白基調の変更後で比較" loading="lazy" src="comparison.png"></a>
</section>
</div>
</main>
</body>
</html>
