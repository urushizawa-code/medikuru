<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f4f8f9">
  <title>メディくる 説明動画｜確認用</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f4f8f9;color:#1d2b2d;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
    main{width:min(100%,440px);margin:0 auto;padding:16px 12px max(20px,env(safe-area-inset-bottom))}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    h1{font-size:19px;line-height:1.4;letter-spacing:0;margin:0;font-weight:800}
    .tag{font-size:12px;line-height:1.4;white-space:nowrap;color:#176b71;background:#e2f2f3;padding:5px 9px;border-radius:6px}
    .player{max-width:384px;margin:0 auto;border-radius:12px;overflow:hidden;box-shadow:0 8px 26px #173f4922;background:#172124}
    video{display:block;width:100%;height:auto;max-height:calc(100svh - 156px);object-fit:contain;aspect-ratio:9/16}
    .save{display:flex;align-items:center;justify-content:center;min-height:48px;gap:8px;max-width:384px;margin:14px auto 0;padding:10px 12px;color:#176b71;background:white;border:1px solid #aed9dc;border-radius:9px;font-size:16px;line-height:1.5;font-weight:700;text-decoration:none;text-align:center}
    .save:focus-visible{outline:3px solid #cf56a0;outline-offset:3px}
    .note{margin:9px 0 0;text-align:center;color:#63777d;font-size:12px;line-height:1.6}
  </style>
</head>
<body>
<main>
  <header><h1>メディくる 説明動画</h1><span class="tag">確認用</span></header>
  <div class="player">
    <video controls playsinline webkit-playsinline preload="metadata" poster="./poster.jpg" aria-label="メディくる説明動画 約2分30秒">
      <source src="./medikuru-intro-opening-preview-20261116.mp4" type="video/mp4">
      <p><a href="./medikuru-intro-opening-preview-20261116.mp4">動画を開く</a></p>
    </video>
  </div>
  <a class="save" href="./medikuru-intro-opening-full-20261116.mp4" download="メディくる_説明動画_最新版.mp4">高画質版を保存</a>
  <p class="note">約2分30秒・音声付き</p>
</main>
</body>
</html>
